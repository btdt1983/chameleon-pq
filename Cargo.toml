[package]
name        = "chameleon-pq"
version     = "0.9.1"
edition     = "2021"
rust-version = "1.80"
license     = "Apache-2.0"
description = "Experimental hybrid post-quantum VPN (ML-KEM-768 + X25519 key agreement, hybrid Ed25519 + ML-DSA-65 peer auth). UNAUDITED — for learning and reference, not for protecting real traffic."
readme      = "README.md"
repository  = "https://github.com/btdt1983/chameleon-pq"
homepage    = "https://github.com/btdt1983/chameleon-pq"
keywords    = ["vpn", "post-quantum", "cryptography", "ml-kem", "wireguard"]
categories  = ["cryptography", "network-programming", "command-line-utilities"]
# No `include` allowlist, so anything sitting in the repo root ships to
# crates.io by default regardless of git-tracked status (bit us once during
# the 0.8.5 publish — see the commit history). `/android` holds the Android
# app (Gradle project + a separate `chameleon-jni` crate) — real, tracked,
# and entirely irrelevant to the published `chameleon-pq` crate, same
# rationale as `/.github`. Re-check with `cargo package --list --allow-dirty`
# before every future `cargo publish`, not just `git status`.
exclude     = ["/.github", "/android"]

# ── Linux server packages (.deb / .rpm) ──────────────────────────────────────
# Built by CI in an old-glibc container (see .github/workflows/ci.yml) so one
# binary runs on Debian 11+ / Ubuntu 20.04+ / EL9. Files live in packaging/linux.
# Install, then run `sudo chameleon-pq setup` — the scripts never configure
# anything interactively.
[package.metadata.deb]
maintainer          = "btdt1983 <btdt1983@users.noreply.github.com>"
section             = "net"
priority            = "optional"
# Explicit, not $auto: dpkg-shlibdeps on a newer build host would claim
# libc6 >= <host version> even though the binary (built on Debian 11) only needs 2.31.
depends             = "libc6 (>= 2.31), libgcc-s1, nftables, iproute2"
extended-description = "Hybrid post-quantum VPN server. After installing run `sudo chameleon-pq setup` to generate keys, a matching client config, and to configure IP forwarding, the firewall and the service. UNAUDITED."
maintainer-scripts  = "packaging/linux/scripts/"
assets = [
    ["target/release/chameleon-pq",                    "usr/bin/",                            "755"],
    ["packaging/linux/chameleon-pq.service",           "lib/systemd/system/",                 "644"],
    ["packaging/linux/chameleon-pq-nft.service",       "lib/systemd/system/",                 "644"],
    ["packaging/linux/chameleon-pq.sysusers",          "usr/lib/sysusers.d/chameleon-pq.conf", "644"],
    ["config.example.toml",                            "usr/share/doc/chameleon-pq/",         "644"],
    ["README.md",                                      "usr/share/doc/chameleon-pq/",         "644"],
]

[package.metadata.generate-rpm]
summary             = "Hybrid post-quantum VPN server (ML-KEM-768 + X25519, Ed25519 + ML-DSA-65)"
post_install_script   = "packaging/linux/scripts/postinst"
pre_uninstall_script  = "packaging/linux/scripts/prerm"
assets = [
    { source = "target/release/chameleon-pq",              dest = "/usr/bin/chameleon-pq",                          mode = "755" },
    { source = "packaging/linux/chameleon-pq.service",     dest = "/usr/lib/systemd/system/chameleon-pq.service",     mode = "644" },
    { source = "packaging/linux/chameleon-pq-nft.service", dest = "/usr/lib/systemd/system/chameleon-pq-nft.service", mode = "644" },
    { source = "packaging/linux/chameleon-pq.sysusers",    dest = "/usr/lib/sysusers.d/chameleon-pq.conf",          mode = "644" },
    { source = "config.example.toml",                      dest = "/usr/share/doc/chameleon-pq/config.example.toml", mode = "644", doc = true },
    { source = "README.md",                                dest = "/usr/share/doc/chameleon-pq/README.md",          mode = "644", doc = true },
]
[package.metadata.generate-rpm.requires]
nftables = "*"
iproute  = "*"

[lib]
name = "chameleon"
path = "src/lib.rs"

[[bin]]
name = "chameleon-pq"
path = "src/main.rs"

[dependencies]
# Crypto
ring              = "0.17"
aegis             = "0.9"
x25519-dalek      = { version = "2", features = ["static_secrets"] }
pqcrypto-mlkem    = "0.1"
pqcrypto-mldsa    = "0.1"
pqcrypto-traits   = "0.3"
hkdf              = "0.12"
sha2              = "0.10"
zeroize           = { version = "1", features = ["derive"] }

# Async + networking
tokio             = { version = "1", features = ["full"] }
bytes             = "1"
# Batched UDP I/O (GSO/GRO on Linux, cross-platform + per-packet fallback).
quinn-udp         = "0.6"
# Raw sockopts (SO_RCVBUF/SO_SNDBUF) on the UDP socket — the OS default recv
# buffer (~64 KB on Windows) overflows on bursty downloads → drops. Already in
# the tree via quinn-udp; pin the same 0.6 line so no second copy is pulled.
socket2           = "0.6"

# TUN interface (cross-platform; Windows needs wintun.dll alongside binary)
# Pinned to =0.8.6 on purpose: it has the async-read fix (wintun AsyncSession,
# no thread-per-read) but still configures the interface address via netsh
# (`set_network_addresses_tuple`), exactly like the last-working 0.6. 0.8.8+
# replaced that with a hand-rolled `CreateUnicastIpAddressEntry` WinAPI call that
# fails on our Windows client with "invalid parameter" (os error 87). A plain
# "0.8.6" would mean ^0.8.6 and resolve back up to the broken 0.8.13 — keep the `=`.
tun               = { version = "=0.8.6", features = ["async"] }

# Config
serde             = { version = "1", features = ["derive"] }
toml              = "0.7"
clap = { version = "4", features = ["derive"] }

# Utilities
rayon             = "1"      # data-parallelle crypto over CPU-cores (Fase C)
rand              = "0.8"
thiserror         = "1"
parking_lot       = "0.12"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow             = "1"

[dev-dependencies]
# Voor #[tokio::test] loopback-tests van de gebatchte UDP-I/O.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

# SO_RCVBUFFORCE/SO_SNDBUFFORCE (bypass net.core.rmem_max when privileged) live
# behind a raw setsockopt — Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
]}

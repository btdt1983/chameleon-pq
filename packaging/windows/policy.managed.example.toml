# Chameleon-PQ policy for a managed machine (Netskope-style: users cannot turn
# the VPN off). Copy next to the service config as policy.toml, for example
#   C:\ProgramData\Chameleon-PQ\policy.toml
# then: sc.exe stop ChameleonPQ  and  sc.exe start ChameleonPQ
#
# Only SYSTEM and Administrators may read or write that folder; the service
# refuses to start otherwise (run `service harden` to fix the permissions).

# Always-on: the service connects by itself when it starts (before anyone logs
# in) and reconnects after every drop. This also means users cannot disconnect
# (the GUI shows an inert button, the service refuses), whatever
# allow_user_disconnect says. Needs network.server_addr in the service config.
auto_connect = true

# Redundant with auto_connect, kept to show the explicit form.
allow_user_disconnect = false

# The kill switch is engaged when the service starts, before any connection:
# until the tunnel is up only the VPN server, the local network and DHCP are
# reachable (so hotel or train Wi-Fi sign-in pages do not work). It stays on if
# the tunnel drops. A system shutdown or crash leaves it on across the reboot;
# stopping the service as an administrator releases it. Requires
# tun.route_all = true in the service config. Administrators can also remove
# it with: chameleon-pq.exe killswitch off
kill_switch = "enforced"

# Optional: restrict which traffic profiles users can pick. The profile in the
# service config must be in the list. Leave it out to allow all of them.
# allowed_profiles = ["balanced", "stealth"]

# No "Check for updates" from the GUI on a managed machine.
allow_update_check = false
